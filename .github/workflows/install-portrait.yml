name: Install portrait

on:
  push:
    branches: [portrait-upload]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portrait-upload
          fetch-depth: 0

      - name: Decode portrait
        run: |
          cat portrait-q68/part0.b64 portrait-q68/part1.b64 portrait-q68/part2.b64 portrait-q68/part3.b64 | base64 -d > /tmp/tunde-portrait.jpg
          file /tmp/tunde-portrait.jpg
          test "$(stat -c%s /tmp/tunde-portrait.jpg)" -eq 34661

      - name: Commit portrait to main
        run: |
          git fetch origin main
          git checkout main
          cp /tmp/tunde-portrait.jpg public/images/tunde-portrait.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/tunde-portrait.jpg
          git commit -m "fix: deploy sharp portrait JPEG"
          git push origin main
