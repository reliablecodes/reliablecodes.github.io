name: Migrate resume into ReliableCode repo

on:
  push:
    paths:
      - '.github/workflows/migrate-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy resume from legacy repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/xohdik/xohdik.github.io/main/resume.pdf \
            --output public/resume.pdf
          test -s public/resume.pdf
          file public/resume.pdf

      - name: Commit resume to this repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/resume.pdf && git ls-files --error-unmatch public/resume.pdf >/dev/null 2>&1; then
            echo 'Resume is already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/resume.pdf
          git commit -m 'chore: add resume to ReliableCode site'
          git push origin HEAD:main
