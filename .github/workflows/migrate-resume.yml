name: Migrate resume into ReliableCode repo

on:
  push:
    paths:
      - '.github/workflows/migrate-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure resume is local
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s public/resume.pdf ]; then
            mkdir -p public
            curl --fail --location --retry 3 \
              https://raw.githubusercontent.com/xohdik/xohdik.github.io/main/resume.pdf \
              --output public/resume.pdf
          fi
          test -s public/resume.pdf
          file public/resume.pdf

      - name: Point portfolio links to local resume
        shell: bash
        run: |
          set -euo pipefail
          OLD='https://raw.githubusercontent.com/xohdik/xohdik.github.io/tundecodes-redesign/public/resume.pdf'
          sed -i "s#${OLD}#/resume.pdf#g" src/layouts/BaseLayout.astro src/pages/index.astro
          grep -n "const resumeUrl = '/resume.pdf';" src/layouts/BaseLayout.astro src/pages/index.astro

      - name: Commit finalized migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/resume.pdf src/layouts/BaseLayout.astro src/pages/index.astro; then
            echo 'Resume migration is already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/resume.pdf src/layouts/BaseLayout.astro src/pages/index.astro
          git commit -m 'chore: serve resume from ReliableCode site'
          git push origin HEAD:main
